# Builds RG CuePlay for Windows on every push (or by hand from the Actions tab).
# Produces two downloads under the run's "Artifacts":
#   - RG-CuePlay-portable.zip : the .exe + an empty portable.txt (the main build;
#     unzip anywhere, all data stays in a `data` folder next to the .exe)
#   - RG-CuePlay-installer    : the NSIS setup .exe
#
# Note: this repo is a Cargo workspace, so Rust builds land in `target/` at the
# repo root, NOT in `src-tauri/target/`. Paths below use `target/release/...`.
name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Reuse compiled Rust dependencies between runs (saves many minutes).
      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      - name: Build app (UI + Rust + installer)
        run: npm run tauri build

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/rg-cueplay.exe portable/
          New-Item -ItemType File -Force portable/portable.txt | Out-Null
          Compress-Archive -Path portable/* -DestinationPath RG-CuePlay-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RG-CuePlay-portable
          path: RG-CuePlay-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RG-CuePlay-installer
          path: target/release/bundle/nsis/*.exe
