# Builds StageGremlin for Windows and publishes it as a GitHub Release.
#
# Starts only when asked: a push to the `release` branch, a version tag (v0.1.0, …),
# or "Run workflow" on the Actions tab. Work on `main` never starts a build.
#
# Each build becomes a Release (Releases page of the repo) with two downloads:
#   - StageGremlin-portable.zip : StageGremlin.exe + portable.txt + data/bin (yt-dlp, ffmpeg, ffprobe).
#                               Unzip anywhere; settings and sign-ins stay in that folder.
#   - StageGremlin-setup.exe    : the installer (no admin rights needed; installs per user)
# Nothing else has to be installed on the show laptop: WebView2 ships with Windows 10/11
# (the installer fetches it if missing) and the C runtime is linked into the .exe.
#
# Note: this repo is a Cargo workspace, so Rust builds land in `target/` at the repo root.
name: Build Windows

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

# A newer build request cancels one that's still running.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Reuse compiled Rust dependencies between runs (saves many minutes).
      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      - name: Download yt-dlp, ffmpeg and ffprobe to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile tools/bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          Get-ChildItem ffmpeg-x -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination tools/bin/
          Get-ChildItem tools/bin

      - name: Build app (UI + Rust + installer)
        # tauri.release.conf.json adds tools/bin (yt-dlp, ffmpeg, ffprobe) as installer resources.
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/data/bin | Out-Null
          Copy-Item target/release/stagegremlin.exe portable/StageGremlin.exe
          New-Item -ItemType File -Force portable/portable.txt | Out-Null
          Copy-Item tools/bin/* portable/data/bin/
          Compress-Archive -Path portable/* -DestinationPath StageGremlin-portable.zip -Force
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName StageGremlin-setup.exe

      - name: Version label
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" } else { $tag = "v$v-build.${{ github.run_number }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StageGremlin ${{ steps.ver.outputs.tag }}
          prerelease: true
          body: |
            Test build from `${{ github.sha }}`. Not tested on a real show yet — see docs/TESTING.md.

            **Portable (recommended):** download StageGremlin-portable.zip → right-click → Properties → Unblock → unzip → run StageGremlin.exe.
            **Installer:** StageGremlin-setup.exe (no admin rights needed).
          files: |
            StageGremlin-portable.zip
            StageGremlin-setup.exe

      # Also keep them on the run page, for 30 days.
      - uses: actions/upload-artifact@v4
        with:
          name: StageGremlin-windows
          path: |
            StageGremlin-portable.zip
            StageGremlin-setup.exe
          retention-days: 30
