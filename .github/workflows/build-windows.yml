# Builds StageGremlin for Windows and publishes it as a GitHub Release.
#
# Backup only: releases are normally built on the laptop with scripts/release.ps1.
# This runs only from "Run workflow" on the Actions tab. No push or tag starts it, because the local
# script creates a v… tag on GitHub and that must not start a second build in the cloud.
#
# Each build becomes a Release (Releases page of the repo) with two downloads:
#   - StageGremlin-portable.zip : StageGremlin.exe + portable.txt + data/bin (yt-dlp, ffmpeg).
#                               Unzip anywhere; settings and sign-ins stay in that folder.
#   - StageGremlin-setup.exe    : the installer (no admin rights needed; installs per user)
# Nothing else has to be installed on the show laptop: WebView2 ships with Windows 10/11
# (the installer fetches it if missing) and the C runtime is linked into the .exe.
#
# Note: this repo is a Cargo workspace, so Rust builds land in `target/` at the repo root.
name: Build Windows

on:
  workflow_dispatch:
  # A push to the `release` branch also builds (so a build can be started without the Actions page).
  push:
    branches: [release]

# A newer build request cancels one that's still running.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Reuse compiled Rust dependencies between runs (saves many minutes).
      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      # Mandatory checks: the build (and the Release) only happens when all of these pass.
      - name: Check — UI type-check and build
        run: npm run build

      - name: Check — UI tests
        shell: pwsh
        run: if ((Get-Content package.json -Raw | ConvertFrom-Json).scripts.test) { npm test; if ($LASTEXITCODE) { exit 1 } }

      - name: Check — engine tests
        run: cargo test -p cueplay-engine

      - name: Check — app tests
        run: cargo test -p stagegremlin

      # Clippy errors fail the build; plain warnings are only reported (Windows-only code can't be
      # linted on the Linux dev machine, so a new lint must not block a show-day build).
      - name: Check — clippy
        run: cargo clippy -p stagegremlin

      - name: Download yt-dlp and ffmpeg to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile tools/bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          Get-ChildItem ffmpeg-x -Recurse -Include ffmpeg.exe | Copy-Item -Destination tools/bin/
          Get-ChildItem tools/bin

      # uBlock Origin Lite (Edge build) for the background player window. tauri.release.conf.json bundles
      # tools/extensions, so the build fails without it (the laptop script fetches it the same way).
      - name: Download uBlock Origin Lite to bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R uBlockOrigin/uBOL-home --pattern "*.edge.zip" -D ubol-tmp
          if ($LASTEXITCODE) { exit 1 }
          Expand-Archive (Get-ChildItem ubol-tmp/*.edge.zip | Select-Object -First 1).FullName -DestinationPath tools/extensions/ubol-lite
          Get-ChildItem tools/extensions/ubol-lite | Select-Object -First 5

      # Next free build number, shared with scripts/release.ps1 (highest v<version>-build.N + 1), so a cloud
      # build never reuses a laptop build's tag. Decided BEFORE building: the app carries its own tag
      # (SG_BUILD_TAG) for the update check.
      - name: Version label
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $prefix = "v$v-build."
          $numbers = gh release list -R ${{ github.repository }} --limit 200 --json tagName --jq ".[].tagName" | Where-Object { $_.StartsWith($prefix) } | ForEach-Object { [int]$_.Substring($prefix.Length) }
          $next = 1 + (($numbers | Measure-Object -Maximum).Maximum)
          $tag = "$prefix$next"
          Write-Host "Building $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # 0.x builds were test builds (pre-release); from 1.0 on every build is a full release.
          "pre=$(if ($v.StartsWith('0.')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "SG_BUILD_TAG=$tag" >> $env:GITHUB_ENV

      - name: Build app (UI + Rust + installer)
        # tauri.release.conf.json adds tools/bin (yt-dlp, ffmpeg) as installer resources.
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/data/bin | Out-Null
          Copy-Item target/release/stagegremlin.exe portable/StageGremlin.exe
          New-Item -ItemType File -Force portable/portable.txt | Out-Null
          Copy-Item tools/bin/* portable/data/bin/
          Copy-Item -Recurse tools/extensions portable/data/extensions
          Compress-Archive -Path portable/* -DestinationPath StageGremlin-portable.zip -Force
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName StageGremlin-setup.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StageGremlin ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.pre }}
          make_latest: ${{ steps.ver.outputs.pre == 'true' && 'false' || 'true' }}
          body: |
            Built from `${{ github.sha }}`. Hardware test notes: docs/TESTING.md.

            **Portable (recommended):** download StageGremlin-portable.zip → right-click → Properties → Unblock → unzip → run StageGremlin.exe.
            **Installer:** StageGremlin-setup.exe (no admin rights needed).
          files: |
            StageGremlin-portable.zip
            StageGremlin-setup.exe

      # Also keep them on the run page, for 30 days.
      - uses: actions/upload-artifact@v4
        with:
          name: StageGremlin-windows
          path: |
            StageGremlin-portable.zip
            StageGremlin-setup.exe
          retention-days: 30
