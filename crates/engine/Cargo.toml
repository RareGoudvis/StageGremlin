[package]
name = "cueplay-engine"
version = "0.1.0"
edition = "2021"
description = "Audio engine for RG CuePlay: show model, playback, DSP and loudness analysis"
license = "AGPL-3.0-or-later"

[features]
default = []
# Real audio output. The Tauri app turns this on; tests run on kira's mock backend.
device = ["kira/cpal"]

[dependencies]
kira = { version = "0.12.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "aac"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "aac", "isomp4"] }
ebur128 = "0.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
hound = "3"
tempfile = "3"
